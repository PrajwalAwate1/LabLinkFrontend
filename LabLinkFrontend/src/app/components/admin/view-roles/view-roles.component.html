<div class="page">

  <!-- Header -->
  <header class="header">
    <div class="header-brand">
      <svg width="32" height="32" viewBox="0 0 40 40" fill="none">
        <rect width="40" height="40" rx="10" fill="#0066CC"/>
        <path d="M12 20h6m0 0v-6m0 6v6m4-12h4a2 2 0 012 2v8a2 2 0 01-2 2h-4"
              stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="brand-name">LabLink</span>
    </div>
    <div class="header-right">
      <span class="admin-badge">Admin</span>
      <button class="btn-back" (click)="goBack()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 5l-7 7 7 7"/>
        </svg>
        Dashboard
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main">

    <div class="page-title-row">
      <div>
        <h2>View Roles</h2>
        <p>All roles defined in the system</p>
      </div>
    </div>

    <!-- Error Banner -->
    <div class="error-banner" *ngIf="error">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      {{ error }}
    </div>

    <!-- Loading -->
    <div class="loading-state" *ngIf="loading">
      <div class="spinner"></div>
      <span>Loading roles...</span>
    </div>

    <!-- Empty State -->
    <div class="empty-state" *ngIf="!loading && roles.length === 0 && !error">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#c0cdd8"
           stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      <p>No roles found.</p>
    </div>

    <!-- Roles Table -->
    <div class="table-wrapper" *ngIf="!loading && roles.length > 0">
      <table class="roles-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Role Name</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let r of roles">
            <td><span class="role-id">{{ r.roleId }}</span></td>
            <td>
              <div class="role-name-cell">
                <div class="role-icon">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                       stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                  </svg>
                </div>
                <span>{{ r.role }}</span>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

  </main>

</div>
