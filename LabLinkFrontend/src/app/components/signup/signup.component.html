<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="logo">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
          <rect width="40" height="40" rx="10" fill="#0066CC"/>
          <path d="M12 20h6m0 0v-6m0 6v6m4-12h4a2 2 0 012 2v8a2 2 0 01-2 2h-4" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1>LabLink</h1>
      <p>Create your patient account</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input
          id="name"
          type="text"
          name="name"
          [(ngModel)]="name"
          placeholder="John Doe"
          autocomplete="name"
          required
          [class.input-error]="nameError"
        />
        <div class="field-error" *ngIf="nameError">{{ nameError }}</div>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
          [class.input-error]="emailError"
        />
        <div class="field-error" *ngIf="emailError">{{ emailError }}</div>
      </div>

      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input
          id="phone"
          type="tel"
          name="phone"
          [(ngModel)]="phone"
          placeholder="10-digit number"
          autocomplete="tel"
          required
          maxlength="10"
          [class.input-error]="phoneError"
        />
        <div class="field-error" *ngIf="phoneError">{{ phoneError }}</div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="password">Password</label>
          <input
            id="password"
            type="password"
            name="password"
            [(ngModel)]="password"
            placeholder="Min 8 characters"
            autocomplete="new-password"
            required
            [class.input-error]="passwordError"
          />
          <div class="field-error" *ngIf="passwordError">{{ passwordError }}</div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input
            id="confirmPassword"
            type="password"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            placeholder="Repeat password"
            autocomplete="new-password"
            required
            [class.input-error]="confirmPasswordError"
          />
          <div class="field-error" *ngIf="confirmPasswordError">{{ confirmPasswordError }}</div>
        </div>
      </div>

      <div class="role-badge">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
          <path d="M8 8a3 3 0 100-6 3 3 0 000 6zm0 1a6 6 0 016 6H2a6 6 0 016-6z"/>
        </svg>
        Registering as: <strong>Patient</strong>
      </div>

      <div class="error-message" *ngIf="errorMessage">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
          <path d="M8 1a7 7 0 100 14A7 7 0 008 1zm-.75 4a.75.75 0 011.5 0v3.5a.75.75 0 01-1.5 0V5zm.75 7a1 1 0 110-2 1 1 0 010 2z"/>
        </svg>
        {{ errorMessage }}
      </div>

      <div class="success-message" *ngIf="successMessage">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
          <path d="M8 1a7 7 0 100 14A7 7 0 008 1zm3.03 5.47a.75.75 0 00-1.06-1.06L7 8.38 5.53 6.91a.75.75 0 00-1.06 1.06l2 2a.75.75 0 001.06 0l3.5-3.5z"/>
        </svg>
        {{ successMessage }}
      </div>

      <button type="submit" class="btn-primary" [disabled]="isLoading">
        <span *ngIf="!isLoading">Create Account</span>
        <span *ngIf="isLoading" class="spinner-inline">
          <svg class="spin" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <circle cx="12" cy="12" r="10" stroke-opacity="0.25"/>
            <path d="M12 2a10 10 0 0110 10"/>
          </svg>
          Creating account...
        </span>
      </button>
    </form>

    <div class="auth-footer">
      <p>Already have an account? <a routerLink="/login">Sign in</a></p>
    </div>
  </div>
</div>
