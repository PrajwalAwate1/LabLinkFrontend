<div class="dashboard">

  <header class="header">
    <div class="header-brand">
      <svg width="32" height="32" viewBox="0 0 40 40" fill="none">
        <rect width="40" height="40" rx="10" fill="#0066CC"/>
        <path d="M12 20h6m0 0v-6m0 6v6m4-12h4a2 2 0 012 2v8a2 2 0 01-2 2h-4"
              stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="brand-name">LabLink</span>
    </div>
    <div class="header-right">
      <span class="lab-badge">Lab Technologist</span>
      <button class="btn-logout" (click)="logout()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/>
        </svg>
        Logout
      </button>
    </div>
  </header>

  <main class="main">
    <div class="page-title">
      <h2>Lab Technologist Dashboard</h2>
      <p>Manage specimens, result entries, tests and panels</p>
    </div>

    <div class="cards-grid">

      <!-- Manage Specimen -->
      <div class="card clickable" (click)="navigateToSpecimen()">
        <div class="card-icon blue">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 3h6m-6 0a1 1 0 00-1 1v7.5L5.5 17A2 2 0 007.4 20h9.2a2 2 0 001.9-3L16 11.5V4a1 1 0 00-1-1m-6 0h6"/>
            <line x1="8" y1="13" x2="16" y2="13"/>
          </svg>
        </div>
        <div class="card-body">
          <h3>Manage Specimen</h3>
          <p>Track and process collected patient specimens</p>
        </div>
        <div class="card-footer">
          <span class="active-link">View Specimens</span>
          <span class="arrow">→</span>
        </div>
      </div>

      <!-- Manage Result Entry -->
      <div class="card clickable" (click)="navigateToResultEntry()">
        <div class="card-icon green">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5"/>
            <path d="M17.5 3.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 8.5-8.5z"/>
          </svg>
        </div>
        <div class="card-body">
          <h3>Manage Result Entry</h3>
          <p>Enter and verify lab test results for patients</p>
        </div>
        <div class="card-footer">
          <span class="active-link">Enter Results</span>
          <span class="arrow">→</span>
        </div>
      </div>

    </div>
  </main>

</div>
